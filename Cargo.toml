[workspace]
members = ["crates/riso-core", "crates/riso-cli"]
resolver = "2"

[workspace.package]
version = "0.4.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
serde_norway = "0.9"
ratatui = "0.30"
ratatui-image = { version = "11", default-features = false, features = ["image-defaults", "crossterm"] }
image = "0.25"
crossterm = "0.29"
tempfile = "3"
