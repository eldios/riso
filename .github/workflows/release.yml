name: release

on:
  push:
    tags: ['v*']

jobs:
  packages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: packaging tools
        run: cargo install cargo-deb cargo-generate-rpm
      - name: build
        run: cargo build --release
      - name: deb
        run: cargo deb -p riso-cli --no-build
      - name: rpm
        run: cargo generate-rpm -p crates/riso-cli
      - name: tarball
        run: |
          tar -C target/release -czf "riso-${GITHUB_REF_NAME}-x86_64-linux.tar.gz" riso
      - name: release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            target/debian/*.deb
            target/generate-rpm/*.rpm
            riso-*.tar.gz

  aur:
    needs: packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: publish to the AUR
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: riso
          pkgbuild: ./packaging/PKGBUILD
          commit_username: eldios
          commit_email: emanuele.lele.calo@gmail.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: riso ${{ github.ref_name }}
          ssh_keyscan_types: rsa,ecdsa,ed25519

  aur-bin:
    needs: packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: pin checksums against the released artifacts
        run: ./scripts/pin-bin-sums.sh packaging/PKGBUILD-bin
      - name: publish to the AUR
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: riso-bin
          pkgbuild: ./packaging/PKGBUILD-bin
          commit_username: eldios
          commit_email: emanuele.lele.calo@gmail.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: riso-bin ${{ github.ref_name }}
          ssh_keyscan_types: rsa,ecdsa,ed25519
