name: release

on:
  push:
    tags: ['v*']

jobs:
  packages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: packaging tools
        run: cargo install cargo-deb cargo-generate-rpm
      - name: build
        run: cargo build --release
      - name: deb
        run: cargo deb -p riso-cli --no-build
      - name: rpm
        run: cargo generate-rpm -p crates/riso-cli
      - name: tarball
        run: |
          tar -C target/release -czf "riso-${GITHUB_REF_NAME}-x86_64-linux.tar.gz" riso
      - name: release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/debian/*.deb
            target/generate-rpm/*.rpm
            riso-*.tar.gz

  aur:
    needs: packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: publish to the AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: riso
          pkgbuild: ./packaging/PKGBUILD
          commit_username: eldios
          commit_email: emanuele.lele.calo@gmail.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: riso ${{ github.ref_name }}
          ssh_keyscan_types: rsa,ecdsa,ed25519

  aur-bin:
    needs: packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: pin checksums against the released artifacts
        run: ./scripts/pin-bin-sums.sh packaging/PKGBUILD-bin
      - name: publish to the AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: riso-bin
          pkgbuild: ./packaging/PKGBUILD-bin
          commit_username: eldios
          commit_email: emanuele.lele.calo@gmail.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: riso-bin ${{ github.ref_name }}
          ssh_keyscan_types: rsa,ecdsa,ed25519
