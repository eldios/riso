---
name: Feature request
description: Something riso should do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do and where riso stops short
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: >-
        Desktop, shell and applications involved; other tools that do this
